# 								odom_ekf.yaml							#
# ekf_localization_node to provide filtered odom data from wheel encoders + imu
# 
# need to make sure to install ros-PACKAGE-robot-localization

robot_odom_ekf:
  ros__parameters:
    # Filter settings
    frequency: 30.0			# 20hz pub frequency on nodes that use data
    sensor_timeout: 0.10	# should be sending new msgs every 0.01s
    two_d_mode: true		# planar robot

    # Coordinate frames
    # map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom

    publish_tf: true
    print_diagnostics: false	# if true, pub extra info to /diagnostics

    # Wheel body-frame velocity
    twist0: /wheel_twist
    twist0_config: [
      false, false, false,		# x, y, z
      false, false, false,		# roll, pitch, yaw
      true,  true,  false, 		# vx, vy, vz
      false, false, true,		# vroll, vpitch, vyaw
      false, false, false		# ax, ay, az
    ]
    twist0_queue_size: 10

    # BNO085 IMU
    imu0: /imu/data
    imu0_config: [
      false, false, false,		# x, y, z
      false, false, true,		# roll, pitch, yaw
      false, false, false,		# vx, vy, vz
      false, false, true,		# vroll, vpitch, vyaw
      true, true, false			# ax, ay, az
    ]
    imu0_queue_size: 10
    imu0_differential: false
    imu0_relative: false
